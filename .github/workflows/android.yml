name: android

# Сборка Android-приложения Buty (Trusted Web Activity поверх https://buty.app).
# Результат — подписанные APK (установить на телефон) и AAB (загрузить в Google Play / RuStore)
# во вкладке Actions → запуск → Artifacts. Инструкция: docs/android.md.

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Версия для пользователей (например, 1.0.1)"
        required: false
        default: "1.0.0"
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: ${{ inputs.version_name || '1.0.0' }}
    steps:
      - name: Код репозитория
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Ключ подписи из секретов
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Не заданы секреты ANDROID_KEYSTORE_BASE64 и ANDROID_KEYSTORE_PASSWORD (Settings → Secrets and variables → Actions). Инструкция: docs/android.md"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/buty-release.jks"
          {
            echo "BUTY_KEYSTORE_PATH=$RUNNER_TEMP/buty-release.jks"
            echo "BUTY_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "BUTY_KEY_PASSWORD=$KEYSTORE_PASSWORD"
            echo "BUTY_KEY_ALIAS=buty"
          } >> "$GITHUB_ENV"

      - name: Сборка APK и AAB
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleRelease bundleRelease

      - name: Проверка подписи и связи с сайтом
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -f "$APK" || { echo "::error::Подписанный APK не собран"; ls -R android/app/build/outputs; exit 1; }
          test -f "$AAB" || { echo "::error::AAB не собран"; exit 1; }
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | tee signer.txt
          APK_SHA=$(grep -m1 "SHA-256 digest" signer.txt | awk '{print $NF}' | tr 'a-f' 'A-F')
          SITE_SHA=$(grep -o '"[0-9A-F:]\{95\}"' public/.well-known/assetlinks.json | tr -d '":' | tr '\n' ' ')
          echo "Отпечаток APK: $APK_SHA"
          echo "Отпечатки в assetlinks.json: $SITE_SHA"
          if echo "$SITE_SHA" | grep -q "$APK_SHA"; then
            echo "Отпечаток совпадает с public/.well-known/assetlinks.json — адресной строки в приложении не будет."
          else
            echo "::warning::Отпечаток ключа не найден в public/.well-known/assetlinks.json — в приложении будет видна адресная строка."
          fi

      - name: Файлы для скачивания
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/buty-${VERSION_NAME}-${VERSION_CODE}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "out/buty-${VERSION_NAME}-${VERSION_CODE}.aab"
          ls -la out

      - name: Загрузка результата
        uses: actions/upload-artifact@v4
        with:
          name: buty-android-${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}
          path: out/*
          retention-days: 30

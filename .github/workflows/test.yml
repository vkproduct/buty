name: test

# Проверка качества перед мержем/деплоем: типы, линтер и юнит-тесты (vitest).
# Падает, если не проходят тесты lib/** или app/** — включая lib/ai-summary.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Версии закреплены по SHA тега — защита от подмены тега взломанным репозиторием
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 12.6.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests (vitest)
        run: pnpm test

  # Деплой на прод только после зелёных тестов (был отдельный deploy.yml —
  # он запускался параллельно и мог выкатить сломанную сборку).
  deploy:
    name: Deploy to production
    needs: test
    if: ${{ needs.test.result == 'success' && vars.SERVER_HOST != '' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - name: Deploy to VPS
        # SHA тега v1.2.0. Ключ GitHub в authorized_keys сервера ограничен
        # префиксом command="/opt/buty/scripts/ci-deploy.sh",no-port-forwarding,… —
        # сервер сам форсит деплой-скрипт, здесь только подключаемся.
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER || 'deploy' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 25m
          script: |
            echo "deploy: команда форсится сервером (ci-deploy.sh)"
